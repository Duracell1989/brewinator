name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build (release)
        run: swift build -c release

      # The version in CommandConfiguration is a hand-maintained literal, so
      # nothing stopped a tag from shipping a binary that reports the previous
      # version. This is that missing check.
      - name: Verify the binary reports the tagged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          reported="$(.build/release/brewinator --version)"
          if [ "$tag" != "$reported" ]; then
            echo "Tag is $tag but the binary reports $reported."
            echo "Update version: in Sources/Brewinator/CLI/BrewinatorCommand.swift."
            exit 1
          fi

      - name: Extract the changelog section for this release
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v version="$tag" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $tag."
            exit 1
          fi
          cat release-notes.md

      # BrewinatorNotify.app (Phase 8, plan doc: brew-notes-swift-rewrite.md) -
      # the resident notification agent the brewinator-notifier cask installs.
      # Unlike `brewinator` itself (build-from-source, never quarantined), a
      # cask ships a *downloaded* prebuilt binary, which Gatekeeper quarantines
      # on arrival - it must be signed with a real Developer ID and notarized
      # before that download ever happens.
      - name: Import the Developer ID Application certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          rm cert.p12

      - name: Build and sign BrewinatorNotify.app
        run: |
          identity="$(security find-identity -v -p codesigning build.keychain \
            | grep 'Developer ID Application' | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\) [A-F0-9]+ "(.*)"$/\1/')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity found in build.keychain."
            exit 1
          fi
          CODESIGN_IDENTITY="$identity" ./Scripts/build-notifier-app.sh

      - name: Notarize and staple BrewinatorNotify.app
        env:
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
        run: |
          echo "$APPLE_NOTARIZATION_KEY_P8" | base64 --decode > AuthKey.p8
          ditto -c -k --keepParent .build/BrewinatorNotify.app BrewinatorNotify.zip
          xcrun notarytool submit BrewinatorNotify.zip \
            --key AuthKey.p8 \
            --key-id "$APPLE_NOTARIZATION_KEY_ID" \
            --issuer "$APPLE_NOTARIZATION_ISSUER_ID" \
            --wait
          rm AuthKey.p8
          xcrun stapler staple .build/BrewinatorNotify.app
          # Stapling modifies the app after the zip above was made - repackage.
          # The distribution zip also carries the cask's installer script, which
          # loads the launch agent from outside Homebrew's install-step sandbox
          # (Homebrew/brew#23891). Notarization above only ever sees the app:
          # the script is not code, and submitting it would notarize nothing.
          # `ditto` for the copy, not `cp` - it is the one that preserves the
          # stapled bundle intact. No --keepParent, so the app and the script
          # sit side by side at the root of the zip, where the cask expects them.
          rm BrewinatorNotify.zip
          rm -rf .build/payload
          mkdir -p .build/payload
          ditto .build/BrewinatorNotify.app .build/payload/BrewinatorNotify.app
          install -m 755 NotifierApp/install-agent.sh .build/payload/install-agent.sh
          ditto -c -k .build/payload BrewinatorNotify.zip

      - name: Remove the CI keychain
        if: always()
        run: security delete-keychain build.keychain || true

      # The release is created as a draft and published only once the asset is
      # verified, because `gh release create` given the file as an argument
      # already did exactly that - created a draft, uploaded, then published -
      # and doing the upload separately gives that atomicity up. Without the
      # draft the tag is public and asset-less for the length of the upload, and
      # a failed upload strands an empty *published* release that the next
      # attempt cannot recreate.
      #
      # Creating only when absent is what makes a re-run work at all: every step
      # here is idempotent, so a job that dies after the release exists can
      # simply be re-run.
      - name: Create the GitHub release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --generate-notes
          fi

      - name: Upload BrewinatorNotify.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" BrewinatorNotify.zip --clobber

      # Deliberately not a check on the API's `assets` array: that array read
      # empty for v0.12.0 and v0.12.1 while the files downloaded fine, which is
      # what caused a needless 0.12.1 release, so gating on it would trade a
      # missing asset for a false alarm. Downloading the asset back and
      # comparing checksums proves the bytes survived the round trip, which a
      # name match cannot - a truncated or zero-byte upload still has the right
      # name, and would fail for users as a sha256 mismatch in the cask.
      - name: Verify the uploaded zip matches the one that was built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf verify && mkdir verify
          gh release download "$GITHUB_REF_NAME" --pattern BrewinatorNotify.zip --dir verify
          built="$(shasum -a 256 BrewinatorNotify.zip | cut -d" " -f1)"
          fetched="$(shasum -a 256 verify/BrewinatorNotify.zip | cut -d" " -f1)"
          echo "built:   $built"
          echo "fetched: $fetched"
          if [ "$built" != "$fetched" ]; then
            echo "The uploaded asset does not match the built zip."
            exit 1
          fi
          rm -rf verify

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      # The URL the cask actually resolves. A draft's asset is not served here
      # at all, so this can only run after publishing - it is the last gate, not
      # the one that protects the draft.
      - name: Verify the published download URL serves the zip
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/BrewinatorNotify.zip"
          status="$(curl -sL -o /dev/null -w "%{http_code}" "$url")"
          echo "$url -> $status"
          [ "$status" = "200" ]
